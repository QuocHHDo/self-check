name: Update prices
# Monthly: BLS publishes average prices around mid-month. Rebuilds js/prices-data.js from free government data,
# runs the tests, and commits only if prices changed. Also runnable from the Actions tab.
on:
  schedule:
    - cron: "17 14 20 * *"
  workflow_dispatch:
  push:
    branches: [probe-branded]
permissions:
  contents: write
  pages: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download BLS and USDA ERS price data
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }} # optional; the keyless API is enough for this
        run: node scripts/fetch-prices.mjs "$RUNNER_TEMP/prices"
      - name: Build prices
        run: node scripts/build-prices.mjs "$RUNNER_TEMP/prices"
      - name: Test
        run: node tests/run.js
      - name: Commit if prices changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- js/prices-data.js data/prices; then echo "No price changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add js/prices-data.js data/prices
          git commit -m "Update prices ($(node -p 'require("./js/prices-data.js").meta.bls'))"
          git push origin HEAD:${{ github.ref_name }}
          # Pushes made with this token don't start other workflows, so ask Pages to rebuild.
          if [ "${{ github.ref_name }}" = "main" ]; then gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; it will publish on the next push."; fi
