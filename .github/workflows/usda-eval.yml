name: USDA accuracy eval
# Run from the Actions tab. Needs a repository secret named USDA_API_KEY
# (free key: https://fdc.nal.usda.gov/api-key-signup.html).
# Results are attached as a download and also saved to the eval-results branch.
on:
  push:
    branches: [probe-branded]
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: only foods whose name matches this text (e.g. beef)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare built-in values with USDA
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: node eval/compare-usda.mjs "${{ github.event.inputs.only }}"
      - uses: actions/upload-artifact@v4
        with:
          name: usda-eval
          path: |
            eval/report.md
            eval/results.json
            eval/suggested-values.json
      - name: Save results to the eval-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout -B eval-results
          git add -f eval/report.md eval/results.json eval/suggested-values.json
          git commit -m "USDA eval results from run ${{ github.run_id }}"
          git push -f origin eval-results
